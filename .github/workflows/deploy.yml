# Publie Athar sur Firebase Hosting à chaque poussée sur `main`.
#
# Lint et tests unitaires passent avant la publication : une mise en ligne ne part
# jamais sur du rouge.
#
# Secrets attendus dans Paramètres → Secrets and variables → Actions :
#   FIREBASE_SERVICE_ACCOUNT_ATHAR_DEV31   clé JSON posée par `firebase init hosting:github`
#   VITE_FIREBASE_API_KEY                  configuration web du projet athar-dev31
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_APP_ID
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Une mise en ligne ne part jamais sans que le socle soit vert.
      - run: npm run lint
      - run: npm run test:run

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATHAR_DEV31 }}
          projectId: athar-dev31
          channelId: live
