# Publie Athar sur Firebase Hosting à chaque poussée sur `main`.
#
# Le workflow ne s'exécute que si le secret FIREBASE_SERVICE_ACCOUNT existe : sans lui,
# l'étape de déploiement est ignorée et rien n'est publié par erreur.
#
# Secrets attendus dans Paramètres → Secrets and variables → Actions :
#   FIREBASE_SERVICE_ACCOUNT   clé JSON du compte de service (déploiement Hosting)
#   VITE_FIREBASE_API_KEY      configuration web du projet athar-dev31
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_APP_ID
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Une mise en ligne ne part jamais sans que le socle soit vert.
      - run: npm run lint
      - run: npm run test:run

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: athar-dev31
          channelId: live
