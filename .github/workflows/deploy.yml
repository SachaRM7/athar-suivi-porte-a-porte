# Contrôle puis publie Athar sur Firebase Hosting (lot A5).
#
# - Toute poussée sur main et toute pull request passent par le job `verifier` : lint, typage, tests
#   unitaires, Functions, règles Firestore et Auth sur émulateurs, parcours critiques
#   (inscription fermée, routes techniques absentes, purge de déconnexion), build vérifié.
# - Seul un lancement manuel sur `main` avec `publish` coché publie, et seulement si
#   `verifier` est vert ET si le build de déploiement passe ses gardes de configuration.
# - Hosting exige un backend vérifié. L'option publish_backend autorise explicitement
#   sa publication préalable (procédure : docs/athar/10-PILOTAGE-INDUSTRIALISATION.md).
#
# Secrets attendus dans Paramètres → Secrets and variables → Actions :
#   FIREBASE_SERVICE_ACCOUNT_ATHAR_DEV31   clé JSON posée par `firebase init hosting:github`
#   VITE_FIREBASE_API_KEY                  configuration web du projet athar-dev31 (publique,
#   VITE_FIREBASE_AUTH_DOMAIN              mais jamais imprimée dans les journaux)
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_APP_ID
name: Déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publier sur Firebase Hosting après validation
        type: boolean
        required: true
        default: false
      publish_backend:
        description: Publier aussi règles, index et Functions avant Hosting
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: athar-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Émulateur Firestore : Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:lot-b
      - run: npm run test:functions
      - run: npm run test:ci-scripts

      # Règles Firestore, Auth et Functions sur émulateurs locaux (projet athar-local).
      - run: npm run test:emulator:ci

      # Build de production vérifié : laboratoires absents, PWA complète, carte différée.
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - run: node scripts/ci/check-backend-contract.mjs

      # Parcours critiques sur le build de production branché aux émulateurs.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:mobile
      - run: npm run test:e2e:emulator:ci

  publier:
    needs: verifier
    environment: production
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions

      # Gardes de configuration, build, vérification du bundle et contrat backend :
      # le moindre écart arrête la publication avant Firebase Hosting.
      - run: npm run build:deploy
        env:
          ATHAR_EXPECTED_PROJECT_ID: athar-dev31
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Publier la version vérifiée
        run: node scripts/ci/publish-release.mjs
        env:
          ATHAR_PUBLISH: ${{ inputs.publish }}
          ATHAR_PUBLISH_BACKEND: ${{ inputs.publish_backend }}
          ATHAR_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATHAR_DEV31 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.sha }}
          path: dist/athar-release.json
          retention-days: 90
